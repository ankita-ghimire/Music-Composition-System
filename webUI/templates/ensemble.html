{% extends 'base.html' %}
{% block title %}Ensemble Composer{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <!-- Generation Form -->
        <div class="col-lg-5">
            <div class="card p-4">
                <h3 class="card-title mb-4"><i class="fas fa-users"></i> Create an Ensemble Piece</h3>
                <form id="ensemble-form">
                    <!-- Key and Mode -->
                    <div class="row">
                        <div class="mb-3"><label for="key" class="form-label">Key</label><select class="form-select" id="key" name="key_name"><option value="C">C</option><option value-="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option><option value="A">A</option><option value="B">B</option></select></div>
           
                        <div class="col-md-6 mb-3">
                            <label for="mode" class="form-label">Mode</label>
                            <select class="form-select" id="mode" name="mode">
                                <option value="major" selected>Major</option>
                                <option value="minor">Minor</option>
                            </select>
                        </div>
                    </div>

                    <!-- Instruments -->
                     <div class="form-section-title">Instrumentation</div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="lead_instrument" class="form-label">Lead Instrument</label>
                            <select class="form-select" id="lead_instrument" name="lead_instrument">
                                <option value="flute" selected>Flute</option>
                                <option value="violin">Violin</option>
                                <option value="salamander-piano">Piano</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="accomp_instrument" class="form-label">Accompaniment</label>
                            <select class="form-select" id="accomp_instrument" name="accomp_instrument">
                                <option value="guitar-acoustic" selected>Acoustic Guitar</option>
                                <option value="salamander-piano">Piano</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Mood and Bars -->
                     <div class="form-section-title">Composition Style</div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="mood" class="form-label">Mood</label>
                            <select class="form-select" id="mood" name="mood">
                                <option value="default" selected>Default</option>
                                <option value="happy">Happy</option>
                                <option value="sad">Sad</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="num_bars" class="form-label">Number of Bars</label>
                            <input type="number" class="form-control" id="num_bars" name="num_bars" value="8" min="4" max="16" required>
                        </div>
                    </div>

                    <!-- Tempo -->
                    <div class="mb-3">
                        <label for="tempo" class="form-label">Tempo: <span id="tempo-value">120</span> BPM</label>
                        <input type="range" class="form-range" id="tempo" name="tempo" min="60" max="180" value="120">
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary" id="compose-btn">
                            <i class="fas fa-magic"></i> Compose
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Results Panel -->
        <div class="col-lg-7">
            <div class="card results-panel" id="results-panel">
                 <div class="text-center p-5" id="placeholder-view">
                    <i class="fas fa-music welcome-icon mb-3"></i>
                    <h4 class="text-muted">Your composition will appear here.</h4>
                </div>
                <div class="w-100 p-4" id="results-view" style="display: none;">
                    <!-- This content is generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // --- UI Elements ---
    const form = document.getElementById('ensemble-form');
    const composeBtn = document.getElementById('compose-btn');
    const resultsPanel = document.getElementById('results-panel');
    const resultsView = document.getElementById('results-view');
    const tempoSlider = document.getElementById('tempo');
    const tempoValue = document.getElementById('tempo-value');
    
    // --- State & Audio ---
    let compositionData = {};
    let currentParts = [];
    let reverb = new Tone.Reverb({ decay: 1.5 }).toDestination();
    let loadedSamplers = {};
    const soundfontLibrary = {
        'salamander-piano': {
            baseUrl: "/static/soundfonts/salamander-piano/",
            notes: { 'A3':'A3.mp3', 'A4':'A4.mp3', 'A5':'A5.mp3', 'C3':'C3.mp3',  'C4':'C4.mp3', 'C5':'C5.mp3', 'D#3':'Ds3.mp3', 'D#4':'Ds4.mp3', 'D#5':'Ds5.mp3', 'F#3':'Fs3.mp3', 'F#4':'Fs4.mp3', 'F#5':'Fs5.mp3' }
        },
        'flute': {
            baseUrl: "/static/soundfonts/flute/",
            notes: { 'A4':'A4_1.mp3', 'A5':'A5_1.mp3', 'A6':'A6.mp3', 'C4':'C4_1.mp3','C5':'C5_1.mp3','C6':'C6.mp3','E4':'E4.mp3', 'E5':'E5.mp3', 'E6':'E6.mp3' }
        },
        'guitar-acoustic': {
            baseUrl: "/static/soundfonts/guitar-acoustic/",
            notes: { 'A2':'A2.mp3', 'A3':'A3.mp3', 'A4':'A4.mp3', 'A#2':'As2.mp3', 'A#3':'As3.mp3', 'B3':'B3.mp3', 'B4':'B4.mp3', 'C3':'C3.mp3', 'C4':'C4.mp3', 'C5':'C5.mp3', 'C#3':'Cs3.mp3', 'C#4':'Cs4.mp3', 'C#5':'Cs5.mp3', 'D2':'D2.mp3', 'D3':'D3.mp3', 'D4':'D4.mp3', 'D5':'D5.mp3',  'D#2':'Ds2.mp3', 'D#3':'Ds3.mp3', 'D#4':'Ds4.mp3', 'E2':'E2.mp3', 'E3':'E3.mp3',  'E4':'E4.mp3', 'F2':'F2.mp3', 'F3':'F3.mp3', 'F4':'F4.mp3',  'F#2':'Fs2.mp3', 'F#3':'Fs3.mp3', 'F#4':'Fs4.mp3', 'G2':'G2.mp3', 'G3':'G3.mp3', 'G4':'G4.mp3', 'G#2':'Gs2.mp3', 'G#3':'Gs3.mp3', 'G#4':'Gs4.mp3' }
        },
        'violin': {
            baseUrl: "/static/soundfonts/violin/",
            notes: { 'A3':'A3_1.mp3', 'A4':'A4_1.mp3', 'A5':'A5.mp3', 'A6':'A6.mp3', 'C4':'C4.mp3', 'C5':'C5.mp3', 'C6':'C6.mp3', 'C7':'C7.mp3', 'E4':'E4.mp3', 'E5':'E5.mp3', 'E6':'E6.mp3', 'G4':'G4.mp3', 'G5':'G5.mp3', 'G6':'G6.mp3' }
        }  };

    // --- Helper Functions ---
    tempoSlider.addEventListener('input', () => { tempoValue.textContent = tempoSlider.value; });
    const toTitleCase = (str) => str.replace(/-/g, ' ').replace(/\b\w/g, char => char.toUpperCase());

    async function getInstrument(name) {
        if (loadedSamplers[name]) return loadedSamplers[name];
        const cfg = soundfontLibrary[name];
        if (!cfg) { console.error(`No soundfont found for ${name}`); return null; }
        const sampler = new Tone.Sampler({ urls: cfg.notes, baseUrl: cfg.baseUrl }).connect(reverb);
        await Tone.loaded();
        loadedSamplers[name] = sampler;
        return sampler;
    }

    // --- Main Form Submission Logic ---
    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        composeBtn.disabled = true;
        composeBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Generating...';
        resultsPanel.innerHTML = `<div class="d-flex flex-column align-items-center justify-content-center p-5"><div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div><p class="mt-3 text-muted">Composing...</p></div>`;

        try {
            const formData = new FormData(form);
            const response = await fetch("{{ url_for('ensemble_action') }}", { method: 'POST', body: formData });
            const result = await response.json();
            if (result.success) {
                compositionData = result.composition_details;
                displayResults(result.composition_details, result.download_url_midi, result.download_url_xml, result.midi_data_url);
            } else {
                throw new Error(result.error || 'Unknown error.');
            }
        } catch (error) {
            resultsPanel.innerHTML = `<div class="d-flex flex-column align-items-center justify-content-center text-center p-5"><i class="fas fa-exclamation-triangle text-danger fa-2x mb-3"></i><h4>Generation Failed</h4><p class="text-muted">${error.message}</p></div>`;
        } finally {
            composeBtn.disabled = false;
            composeBtn.innerHTML = '<i class="fas fa-magic"></i> Compose';
        }
    });

    // --- Display & Player Logic ---
    function displayResults(details, midiUrl, xmlUrl, midiDataUrl) {
        resultsPanel.innerHTML = ''; 
        resultsView.innerHTML = `
            <div class="text-center">
                <i class="fas fa-check-circle success-icon mb-3"></i>
                <h4 class="mb-1">Composition Ready!</h4>
                <p class="text-muted mb-3"><strong>${details.title}</strong></p>
                <div class="player-container mb-3">
                    <div class="player-controls"><button id="play-pause-btn" class="btn btn-primary"><i class="fas fa-spinner fa-spin"></i> Loading...</button></div>
                    <div class="progress-bar-container">
                        <span id="current-time" class="timestamp">00:00</span>
                        <input type="range" id="seek-slider" class="seek-slider" value="0" step="0.1">
                        <span id="duration" class="timestamp">00:00</span>
                    </div>
                </div>
                <ul class="list-group list-group-flush text-start mb-4">
                    <li class="list-group-item"><strong>Lead:</strong> ${toTitleCase(details.lead_instrument)}</li>
                    <li class="list-group-item"><strong>Accompaniment:</strong> ${toTitleCase(details.accomp_instrument)}</li>
                </ul>
                <div class="action-buttons">
                    <button class="btn btn-success" id="save-btn"><i class="fas fa-save"></i> Save to Library</button>
                    <div class="btn-group">
                        <a href="${midiUrl}" class="btn btn-outline-secondary"><i class="fas fa-download"></i> MIDI</a>
                        <button type="button" class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown"></button>
                        <ul class="dropdown-menu"><li><a class="dropdown-item" href="${xmlUrl}">Sheet Music (.xml)</a></li></ul>
                    </div>
                </div>
                <div id="save-status" class="mt-3" style="height: 24px;"></div>
            </div>`;
        resultsView.style.display = 'block';
        resultsPanel.appendChild(resultsView);
        setupPlayer(midiDataUrl, details.lead_instrument, details.accomp_instrument);
    }
    
    // --- THIS FUNCTION IS NOW FIXED ---
    async function setupPlayer(midiDataUrl, leadInstName, accompInstName) {
        const playBtn = document.getElementById('play-pause-btn');
        const playIcon = playBtn.querySelector('i');
        const seekSlider = document.getElementById('seek-slider');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');

        playBtn.disabled = true; 
        
        try {
            await Tone.start();
            // Reset transport before loading new music
            Tone.Transport.stop();
            Tone.Transport.cancel();
            Tone.Transport.position = 0;
            currentParts.forEach(p => p.dispose());
            currentParts = [];

            const [midi, leadSampler, accompSampler] = await Promise.all([
                Midi.fromUrl(midiDataUrl),
                getInstrument(leadInstName),
                getInstrument(accompInstName)
            ]);

            if (midi.tracks[0] && leadSampler) {
                 currentParts.push(new Tone.Part((time, note) => {
                    leadSampler.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                }, midi.tracks[0].notes).start(0));
            }
            if (midi.tracks[1] && accompSampler) {
                currentParts.push(new Tone.Part((time, note) => {
                    accompSampler.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                }, midi.tracks[1].notes).start(0));
            }

            const formatTime = (seconds) => new Date(seconds * 1000).toISOString().substr(14, 5);
            const duration = midi.duration;
            durationEl.textContent = formatTime(duration);
            seekSlider.max = duration;

            // --- THE FIX: Schedule transport events for correct UI updates ---
            
            // 1. Schedule a stop at the end of the song
            Tone.Transport.scheduleOnce(() => Tone.Transport.stop(), duration);

            // 2. Schedule the UI update loop
            const updateLoop = Tone.Transport.scheduleRepeat(() => {
                const currentTime = Tone.Transport.seconds;
                seekSlider.value = currentTime;
                currentTimeEl.textContent = formatTime(currentTime);
            }, 0.1);

            // 3. Create a robust stop handler to reset the UI
            Tone.Transport.on('stop', () => {
                 playBtn.innerHTML = `<i class="fas fa-play"></i> Play`;
                 // Reset position after a brief moment to avoid race conditions
                 setTimeout(() => {
                    Tone.Transport.position = 0;
                    seekSlider.value = 0;
                    currentTimeEl.textContent = '00:00';
                 }, 100);
            });

            playBtn.addEventListener('click', () => {
                if (Tone.Transport.state === 'started') {
                    Tone.Transport.pause(); // Using pause is better than stop for this toggle
                } else {
                    Tone.Transport.start();
                    playBtn.innerHTML = `<i class="fas fa-pause"></i> Pause`;
                }
            });
            
             // Separate handler for pause since it's a different state from 'stopped'
            Tone.Transport.on('pause', () => {
                playBtn.innerHTML = `<i class="fas fa-play"></i> Play`;
            });

            seekSlider.addEventListener('input', () => { Tone.Transport.seconds = seekSlider.value; });
            
            playBtn.disabled = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i> Play';

        } catch(err) {
            console.error("Player setup failed:", err);
            playBtn.className = 'btn btn-danger';
            playBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Player Error';
            const playerContainer = playBtn.closest('.player-container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'text-danger mt-2 small';
            errorDiv.innerText = 'Could not load instrument sounds. Check console and verify audio files exist.';
            playerContainer.appendChild(errorDiv);
        }
    }

    // --- Save Button Logic (Event Delegation) ---
    resultsPanel.addEventListener('click', async function(event) {
        const saveBtn = event.target.closest('#save-btn');
        if (saveBtn) {
            const saveStatus = document.getElementById('save-status');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';
            try {
                const response = await fetch("{{ url_for('save_ensemble_composition_action') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(compositionData)
                });
                const result = await response.json();
                if (result.success) {
                    saveBtn.innerHTML = '<i class="fas fa-check"></i> Saved!';
                    saveStatus.innerHTML = `<span class="text-success">${result.message}</span>`;
                } else { throw new Error(result.error); }
            } catch (error) {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Save to Library';
                saveStatus.innerHTML = `<span class="text-danger">Error: ${error.message}</span>`;
            }
        }
    });
});
</script>
{% endblock %}
